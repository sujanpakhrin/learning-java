name: Java CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn --batch-mode clean verify

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/java-devops-demo:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/java-devops-demo:latest

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: self-hosted

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Sync deployment files
        run: |
          mkdir -p "$HOME/deployment"
          cp deployment/compose.yml "$HOME/deployment/compose.yml"
          rm -rf "$HOME/deployment/nginx"
          cp -r deployment/nginx "$HOME/deployment/nginx"

      - name: Deploy with Docker Compose
        env:
          APP_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$HOME/deployment"
          test -f .env || { echo "ERROR: ~/deployment/.env is missing"; exit 1; }
          sed -i "s/^APP_TAG=.*/APP_TAG=${APP_TAG}/" .env
          docker compose pull
          docker compose up -d --no-build --remove-orphans
          docker compose ps

      - name: Verify deployment
        run: |
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost/health
          echo
          curl -fsS http://localhost/students > /dev/null
          docker inspect -f '{{.Config.Image}}' java-devops-demo-app-1